name: Update RU routing data

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/build_ru_routes.py'
      - 'extra-direct-ru.txt'
      - '.github/workflows/update-ru-routes.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build RU rule sets
        run: python3 scripts/build_ru_routes.py

      - name: Validate generated JSON
        run: |
          python3 -m json.tool rule-set/ru-all.json >/dev/null
          python3 -m json.tool rule-set/ru-geosite.json >/dev/null
          python3 -m json.tool rule-set/ru-geoip.json >/dev/null

      - name: Commit changes
        run: |
          git add rule-set rules
          if git diff --cached --quiet; then
            echo "No routing data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update RU routing data $(date -u +%Y-%m-%d)"
          git push
